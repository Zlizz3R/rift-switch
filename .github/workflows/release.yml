# Push a tag like v1.1.0 (matching "version" in src-tauri/tauri.conf.json): this builds the installer
# and publishes it as a GitHub release - installed copies then update themselves.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # no release unless every check is green
      - run: npm test
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: npx tauri build
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *-setup.exe; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          node ../../../../../tools/release-notes.js "${GITHUB_REF_NAME}" > notes.md
          gh release create "${GITHUB_REF_NAME}" *-setup.exe *-setup.exe.sha256 --title "Rift Switch ${GITHUB_REF_NAME}" --notes-file notes.md
