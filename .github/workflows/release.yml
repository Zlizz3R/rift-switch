# Push a tag like v1.2.0 (matching "version" in src-tauri/tauri.conf.json): this builds the installer
# and publishes it as a GitHub release - installed copies then update themselves.
#
# Hardened: two jobs. "build" runs every check and builds with read-only rights; only "publish"
# may write the release, and it gets nothing but the finished files. A release only happens for a
# tag on main whose name matches the app version, and the installer gets a signed build provenance
# (GitHub attestation: anyone can check with `gh attestation verify <file> -R Zlizz3R/rift-switch`
# that it was built here from this commit).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the version
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag is not on main"; exit 1; }
          want="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $want"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # no release unless every check is green
      - run: npm test
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: npx tauri build
      - name: Checksums and release text
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cd out
          for f in *-setup.exe; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          node ../tools/release-notes.js "${GITHUB_REF_NAME}" > notes.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          gh release create "${GITHUB_REF_NAME}" *-setup.exe *-setup.exe.sha256 \
            --repo "${GITHUB_REPOSITORY}" --title "Rift Switch ${GITHUB_REF_NAME}" --notes-file notes.md
