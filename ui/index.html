<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rift Switch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- texts: data-i18n = text, data-i18n-title = tooltip, data-i18n-ph = placeholder (see i18n.js) -->
<div class="frame">
  <header class="titlebar">
    <div class="brand"><span class="logo">L</span><span data-i18n="app.name">Rift Switch</span></div>
    <div class="nav-arrows"><button id="navBack" data-i18n-title="nav.back" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="navFwd" data-i18n-title="nav.fwd" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="pl-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="plSearch" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="pl.searchPh" data-i18n-title="pl.searchT"><div class="pl-suggest" id="plSuggest" hidden></div></div>
    <div class="live" id="live"></div>
    <button class="stream-pill" id="streamPill" hidden data-i18n-title="stream.pillTitle"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span data-i18n="stream.pill"></span></button>
    <label class="aa-toggle" data-i18n-title="aa.title"><input type="checkbox" id="aaToggle"><span class="sw"></span><span data-i18n="aa.label"></span></label>
    <div class="winbtns">
      <button id="min" data-i18n-title="win.min"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
      <button id="toTray" data-i18n-title="win.tray"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
      <button id="close" class="x" data-i18n-title="win.quit"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar topnav">
      <button class="nav active" id="navAccounts" data-i18n-title="nav.accounts">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="9" rx="1.5"/><rect x="3" y="14" width="7.5" height="7" rx="1.5"/><rect x="13.5" y="14" width="7.5" height="7" rx="1.5"/></svg>
      <span class="nav-l" data-i18n="nav.accounts"></span></button>
      <button class="nav" id="navDash" data-i18n-title="nav.dash">
        <svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M16 6h4v4"/></svg>
      <span class="nav-l" data-i18n="nav.dash"></span></button>
      <button class="nav" id="navColl" data-i18n-title="nav.coll">
        <svg viewBox="0 0 24 24"><path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 9l2-5h14l2 5"/><path d="M10 13h4"/></svg>
      <span class="nav-l" data-i18n="nav.coll"></span></button>
      <button class="nav" id="navLive" data-i18n-title="nav.live">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="live-dot" id="liveDot" hidden></span>
      <span class="nav-l" data-i18n="nav.live"></span></button>
      <button class="nav" id="navMatches" data-i18n-title="nav.matches">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/></svg>
      <span class="nav-l" data-i18n="nav.matches"></span></button>
      <button class="nav" id="navTools" data-i18n-title="nav.tools">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
      <span class="nav-l" data-i18n="nav.tools"></span></button>
      <button class="nav add" id="navAdd" data-i18n-title="nav.add">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="nav coffee" id="navCoffee" data-i18n-title="support.title">
        <svg viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg>
      </button>
      <button class="nav" id="navSettings" data-i18n-title="nav.settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </nav>

    <main>
      <div class="mismatch" id="mismatch" hidden>
        <span class="mm-ic">⚠</span><span id="mmText"></span><span class="grow"></span>
        <button class="btn small gold" id="mmFix"></button>
      </div>
      <div class="crypto-warn" id="cryptoWarn" hidden>
        <b data-i18n="crypto.title"></b><span data-i18n="crypto.text"></span>
      </div>
      <div id="viewAccounts">
      <div class="head">
        <div class="title-row">
          <h1><span data-i18n="head.title"></span></h1>
          <button class="add-cat" id="addAcc"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="head.addAcc"></span></button>
          <button class="add-cat" id="addCat" data-i18n-title="head.addCatTitle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="head.addCat"></span></button>
          <span class="grow"></span>
          <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="search" data-i18n-ph="head.search" spellcheck="false"></label>
          <select id="sort">
            <option value="level" data-i18n="sort.level"></option>
            <option value="custom" data-i18n="sort.custom"></option>
            <option value="rank" data-i18n="sort.rank"></option>
            <option value="flex" data-i18n="sort.flex"></option>
            <option value="played" data-i18n="sort.played"></option>
            <option value="name" data-i18n="sort.name"></option>
          </select>
          <div class="seg layout-seg">
            <button data-layout="tiles" data-i18n-title="lay.tiles"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
            <button data-layout="compact" data-i18n-title="lay.compact"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="9.5" y="4" width="5" height="5" rx="1"/><rect x="16" y="4" width="5" height="5" rx="1"/><rect x="3" y="11" width="5" height="5" rx="1"/><rect x="9.5" y="11" width="5" height="5" rx="1"/><rect x="16" y="11" width="5" height="5" rx="1"/></svg></button>
            <button data-layout="list" data-i18n-title="lay.list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
          </div>
          <button class="tool-btn" id="keysBtn" data-i18n-title="keys.title"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
          <button class="tool-btn" id="editTiles" data-i18n-title="head.editTiles"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
        </div>
      </div>
      <div id="board"></div>
      <div class="empty" id="empty" hidden>
        <div class="empty-ring"><span>+</span></div>
        <h2 data-i18n="empty.title"></h2>
        <p data-i18n="empty.text"></p>
        <button class="btn gold" id="emptyAdd" data-i18n="empty.btn"></button>
      </div>
      </div>

      <section id="viewDash" hidden>
        <div class="head"><h1><span data-i18n="dash.title"></span></h1><p class="sub" data-i18n="dash.sub"></p></div>
        <div class="subtabs" id="dashTabs">
          <button data-dt="lp" data-i18n="dash.tabLp"></button><button data-dt="stats" data-i18n="dash.tabStats"></button><button data-dt="champs" data-i18n="dash.tabChamps"></button><button data-dt="style" data-i18n="dash.tabStyle"></button><button data-dt="deaths" data-i18n="dash.tabDeaths"></button><button data-dt="mast" data-i18n="dash.tabMast"></button><button data-dt="tags" data-i18n="dash.tabTags"></button><button data-dt="seasons" data-i18n="dash.tabSeasons"></button>
          <span class="grow"></span><button class="btn load-btn" data-loadall=""></button>
        </div>
        <div class="seg ov-accs" id="ovAccs" hidden></div>
        <div id="dashLp">
          <div class="mh-filter">
            <div class="seg"><button data-dq="solo">Solo/Duo</button><button data-dq="flex">Flex</button><button data-dq="r5">Ranked 5v5</button><button data-dq="classic">Classic 5v5</button></div>
            <div class="seg"><button data-dd="7" data-i18n="dash.d7"></button><button data-dd="30" data-i18n="dash.d30"></button><button data-dd="90" data-i18n="dash.d90"></button><button data-dd="0" data-i18n="dash.all"></button></div>
          </div>
          <div id="dashBody"></div>
        </div>
        <div id="dashPerf" hidden>
          <div class="mh-filter perf-filter">
            <div class="seg" id="perfQueues"></div><select id="perfRange"></select>
            <div class="seg perf-roles" id="perfRole"></div>
          </div>
          <p class="perf-line" id="perfLine"></p>
          <div id="perfBody"></div>
        </div>
        <div id="dashTags" hidden>
          <div class="mh-filter">
            <div class="seg perf-roles" id="tagRole"></div>
            <span class="grow"></span><span class="coll-for" id="tagSub"></span>
          </div>
          <div id="tagBody"></div>
        </div>
        <div id="dashSeasons" hidden><div id="seasonsBody"></div></div>
        <div id="dashMast" hidden>
          <div class="mh-filter">
            <label class="search coll-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="mastSearch" data-i18n-ph="mast.search" spellcheck="false"></label>
            <span class="grow"></span><span class="coll-for" id="mastSub"></span>
          </div>
          <div id="mastBody"></div>
        </div>
      </section>

      <section id="viewColl" hidden>
        <div class="head"><h1><span data-i18n="coll.title"></span></h1><p class="sub" data-i18n="coll.sub"></p></div>
        <div class="mh-filter">
          <label class="search coll-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="collSearch" data-i18n-ph="coll.search" spellcheck="false"></label>
          <div class="seg"><button data-ck="all" data-i18n="mh.allQueues"></button><button data-ck="champ" data-i18n="coll.champs"></button><button data-ck="skin" data-i18n="coll.skins"></button><button data-ck="shard" data-i18n="coll.shards"></button></div>
          <span class="grow"></span>
          <span class="coll-for" id="collReadFor"></span>
          <button class="btn load-btn" id="collRead" data-loadall=""></button>
        </div>
        <div id="collTiles" class="coll-tiles"></div>
        <div id="collBody"></div>
      </section>

      <section id="viewLive" hidden>
        <div class="head"><h1><span data-i18n="live.title"></span> <button class="help-btn" data-help="live" data-i18n-title="help.open">?</button></h1><p class="sub" id="liveSub"></p></div>
        <div id="liveBody"></div>
      </section>

      <section id="viewMatches" hidden>
        <div class="head"><h1><span data-i18n="mh.title"></span> <button class="help-btn" data-help="mh" data-i18n-title="help.open">?</button></h1><p class="sub" id="mhSub"></p></div>
        <div class="seg mh-accs" id="mhAccs"></div>
        <div class="mh-filter">
          <div class="seg">
            <button data-mhq="" data-i18n="mh.allQueues"></button><button data-mhq="solo">Solo/Duo</button><button data-mhq="flex">Flex</button>
            <button data-mhq="r5">Ranked 5v5</button><button data-mhq="classic">Classic 5v5</button>
            <button data-mhq="normal" data-i18n="mh.normal"></button><button data-mhq="aram">ARAM</button><button data-mhq="arena">Arena</button><button data-mhq="clash">Clash</button>
          </div>
          <span class="grow"></span>
          <span class="mh-store" id="mhStore" data-i18n-title="mh.storeTitle"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span id="mhStoreText"></span></span>
          <button class="btn small icon-btn danger" id="mhClear" data-i18n-title="mh.clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
          <button class="btn load-btn" data-loadall=""></button>
        </div>
        <div class="mh-filter">
          <select id="mhRange">
            <option value="all" data-i18n="mh.rAll"></option><option value="today" data-i18n="mh.rToday"></option>
            <option value="7" data-i18n="mh.r7"></option><option value="30" data-i18n="mh.r30"></option><option value="90" data-i18n="mh.r90"></option>
            <option value="custom" data-i18n="mh.rCustom"></option>
          </select>
          <span class="mh-dates" id="mhDates" hidden>
            <input class="mh-input date" id="mhFrom" type="date"><span>–</span><input class="mh-input date" id="mhTo" type="date">
          </span>
          <div class="seg">
            <button data-mhr="" data-i18n="mh.resAll"></button><button data-mhr="win" data-i18n="mh.wins"></button><button data-mhr="loss" data-i18n="mh.losses"></button>
          </div>
          <input class="mh-input" id="mhChamp" list="mhChampList" data-i18n-ph="mh.champPh" spellcheck="false">
          <datalist id="mhChampList"></datalist>
          <select id="mhSort">
            <option value="new" data-i18n="mh.sNew"></option><option value="kda" data-i18n="mh.sKda"></option>
            <option value="kills" data-i18n="mh.sKills"></option><option value="deaths" data-i18n="mh.sDeaths"></option>
            <option value="dmg" data-i18n="mh.sDmg"></option><option value="cs" data-i18n="mh.sCs"></option><option value="long" data-i18n="mh.sLong"></option>
          </select>
          <button class="btn small mh-adv-btn" id="mhAdvBtn"><span data-i18n="mh.moreFilters"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="mh-filter mh-adv" id="mhAdv" hidden>
          <label><span data-i18n="mh.minKills"></span><input class="mh-input num" id="mhMinK" type="number" min="0" max="60"></label>
          <label><span data-i18n="mh.maxDeaths"></span><input class="mh-input num" id="mhMaxD" type="number" min="0" max="60"></label>
          <label><span data-i18n="mh.minKda"></span><input class="mh-input num" id="mhMinKda" type="number" min="0" max="50" step="0.5"></label>
          <select id="mhMulti">
            <option value="" data-i18n="mh.multiAny"></option><option value="2" data-i18n="mh.m2"></option><option value="3" data-i18n="mh.m3"></option>
            <option value="4" data-i18n="mh.m4"></option><option value="5" data-i18n="mh.m5"></option>
          </select>
          <span class="grow"></span>
          <button class="btn small" id="mhReset" data-i18n="mh.reset"></button>
        </div>
        <div id="mhSummary"></div>
        <div id="mhList"></div>
      </section>

      <section id="viewPlayer" hidden>
        <div class="head pl-head" id="plHead"></div>
        <div id="plBody"></div>
      </section>

      <section id="viewTools" hidden>
        <div class="head"><h1><span data-i18n="tools.title"></span> <button class="help-btn" data-help="tools" data-i18n-title="help.open">?</button></h1></div>
        <div class="tools-grid">
          <button class="tool-card" id="toolRefresh"><b data-i18n="tools.refresh"></b><span data-i18n="tools.refreshT"></span></button>
          <button class="tool-card" data-tool="closeAll"><b data-i18n="tools.closeAll"></b><span data-i18n="tools.closeAllT"></span></button>
          <button class="tool-card" data-tool="restart"><b data-i18n="tools.restart"></b><span data-i18n="tools.restartT"></span></button>
          <button class="tool-card" data-tool="clearCache"><b data-i18n="tools.clearCache"></b><span data-i18n="tools.clearCacheT"></span></button>
          <button class="tool-card" data-tool="openLogs"><b data-i18n="tools.openLogs"></b><span data-i18n="tools.openLogsT"></span></button>
          <button class="tool-card" data-tool="openData"><b data-i18n="tools.openData"></b><span data-i18n="tools.openDataT"></span></button>
          <button class="tool-card" id="toolDiag"><b data-i18n="tools.diag"></b><span data-i18n="tools.diagT"></span></button>
        </div>
      </section>
    </main>

    <aside class="detail" id="detail"></aside>

    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <h2><span data-i18n="add.title"></span> <span class="info" data-i18n-title="add.lockHint">?</span></h2>
        <button class="icon" id="drawerClose"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9"/></svg></button>
      </div>
      <form class="login-form" id="addForm" autocomplete="off">
        <div class="form-title"><span data-i18n="add.save"></span> <span class="info" data-i18n-title="add.saveHint">?</span></div>
        <label><span><span data-i18n="add.riotId"></span> <span class="opt" data-i18n="add.optional"></span> <span class="info" data-i18n-title="add.idHint">?</span></span>
          <input id="addRiotId" spellcheck="false" maxlength="200" placeholder="Name#Tag / op.gg">
        </label>
        <label><span data-i18n="add.user"></span>
          <input id="addUser" spellcheck="false" maxlength="64">
        </label>
        <label><span data-i18n="add.pass"></span>
          <span class="pw"><input id="addPass" type="password" maxlength="128">
            <button type="button" class="eye" data-eye="addPass" data-i18n-title="show"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
        <p class="safe-note"><span class="lock-ic" aria-hidden="true">🔒</span><span data-i18n="add.safe"></span></p>
        <button class="btn gold wide" type="submit" data-i18n="add.btn"></button>
      </form>

      <div class="sep"><span data-i18n="add.or"></span></div>

      <button class="option" id="optCurrent">
        <span class="opt-title" data-i18n="add.current"></span>
        <span class="opt-sub" id="optCurrentSub"></span>
      </button>
      <button class="option" id="optBulk">
        <span class="opt-title" data-i18n="add.bulk"></span>
        <span class="opt-sub" data-i18n="add.bulkSub"></span>
      </button>
      <button class="option" id="optManual">
        <span class="opt-title" data-i18n="add.manual"></span>
        <span class="opt-sub" data-i18n="add.manualSub"></span>
      </button>

    </aside>

    <aside class="drawer" id="settingsDrawer">
      <div class="drawer-head">
        <h2 data-i18n="set.title"></h2>
        <button class="icon" id="settingsClose"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9"/></svg></button>
      </div>
      <div class="set-g" data-i18n="set.gAppearance"></div>
      <div class="lang-row">
        <span data-i18n="set.language"></span>
        <select id="langSelect"></select>
      </div>
      <div class="lang-row">
        <span data-i18n="set.colors"></span>
        <select id="themeSelect">
          <option value="system" data-i18n="theme.system"></option>
          <option value="light" data-i18n="theme.light"></option>
          <option value="dark" data-i18n="theme.dark"></option>
        </select>
      </div>
      <div class="lang-row">
        <span data-i18n="set.uiScale"></span>
        <select id="scaleSelect">
          <option value="80">80 %</option><option value="90">90 %</option><option value="100">100 %</option>
          <option value="110">110 %</option><option value="125">125 %</option><option value="150">150 %</option>
        </select>
      </div>
      <button class="option" id="openTileEditor">
